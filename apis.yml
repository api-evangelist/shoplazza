aid: shoplazza
name: Shoplazza
description: >-
  Shoplazza is a global e-commerce SaaS platform that lets merchants build and
  run online stores, and lets partners extend the platform through public apps,
  payment apps, storefront themes, and checkout/theme extensions. Its developer
  surface is the versioned REST Admin API (date-based vYYYYMM versions served
  under /openapi/YYYY-MM/), authorized with OAuth 2.0 access tokens and scoped
  permissions, plus webhooks for store events, an app billing API, App Bridge
  for embedded admin apps, the Shoplazza CLI, and official OAuth SDKs. Shoplazza
  is backed by SoftBank Vision Fund. This profile was enriched from Shoplazza's
  public developer documentation (shoplazza.dev) and its published OpenAPI 3.1
  specification.
