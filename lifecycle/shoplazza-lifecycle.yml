description: >-
  Shoplazza runs a date-based, versioned REST Admin API. Versions follow the
  vYYYYMM naming convention and are served under the /openapi/YYYY-MM/ path
  prefix. A new API version is released every six months; older versions remain
  supported for a period and are eventually sunset (each version carries a
  Sunset field in the changelog).
