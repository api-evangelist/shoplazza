                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                example: 8ecc0550-fb48-4860-9bb3-9b85e3c2b44a
                              product_id:
                                type: string
                                example: c1d5b2a3-fab1-4e26-8582-75d3b2677042
                              image_id:
                                type: string
                                example: ''
                              created_at:
                                type: string
                                example: '2022-01-10T06:11:45Z'
                              updated_at:
                                type: string
                                example: '2022-01-10T06:11:45Z'
