                tax_total:
                  type: string
                  description: The amount of tax, string format, e.g. "10.00"
                discount:
                  type: string
                  description: Discount amount or percent for the order, discount amount cannot be greater than total price of line items, e.g. "10.00", "10%"
                tags:
