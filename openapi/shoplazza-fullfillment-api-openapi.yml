        schema:
          type: string
      - name: updated_at_max
        in: query
        description: 'filter fulfillments last updated at or before date, for example: `2016-01-18T23:41:00Z`'
        schema:
          type: string
      responses:
        '200':
          description: '200'
          content:
            application/json:
              examples:
                Result:
                  value: "{\n  \"count\": 1\n}"
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    example: 1
                    default: 0
      deprecated: false
