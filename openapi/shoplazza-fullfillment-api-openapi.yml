  /openapi/2022-01/orders/{order_id}/fulfillments/{fulfillment_id}/complete:
    post:
      tags:
      - Fullfillment
      summary: Complete Fulfillment
      description: ''
      operationId: complete_fulfillment
      parameters:
      - name: order_id
        in: path
        description: Order's ID
        schema:
          type: string
        required: true
      - name: fulfillment_id
        in: path
        description: Fulfillment id
        schema:
          type: string
        required: true
      responses:
        '200':
